<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#101114" />
  <title>Sin conexión — DOPE SHOP</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F7F8FA;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:420px;text-align:center}
    .logo{width:64px;height:64px;border-radius:16px;background:#101114;color:#B8FF45;font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
    h1{font-size:24px;margin:0 0 8px}
    p{color:#6B7280;line-height:1.5;margin:0 0 24px}
    button{background:#101114;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:16px;font-weight:600;cursor:pointer;min-height:44px}
    button:focus-visible{outline:3px solid #B8FF45;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">D</div>
    <h1>Sin conexión a Internet</h1>
    <p>Comprueba tu conexión para continuar con la compra. Los pedidos no se pueden enviar sin conexión.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
